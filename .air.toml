# Config file for Air - https://github.com/cosmtrek/air

root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/clai ./cmd/clai"
bin = "tmp/clai"
log = "air.log"
include_ext = ["go"]
exclude_dir = ["assets", "tmp", "vendor", "_build", "model_test_results", "archive", ".git", ".clai", ".opencode", "node_modules", "scripts/ralph-opencode/node_modules"]
stop_on_error = true
delay = 1000
send_interrupt = true
kill_delay = 1000
rerun = false
rerun_delay = 500

[log]
time = false

[color]
main = "yellow"
watcher = "cyan"
build = "green"
runner = "magenta"

[misc]
clean_on_exit = true

[screen]
clear_on_rebuild = false
keep_scroll_on_rebuild = true
